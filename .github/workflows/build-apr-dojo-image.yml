name: Build APR Dojo Image

on:
  push:
    branches:
      - feature/apr-dojo-control-plane
    paths:
      - "frontend/**"
      - "src/**"
      - "deploy/azure/Dockerfile"
      - ".github/workflows/build-apr-dojo-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-proof-runtime-apr-dojo:56d9b912" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/azure/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Verify pushed image
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ steps.meta.outputs.image }}"
