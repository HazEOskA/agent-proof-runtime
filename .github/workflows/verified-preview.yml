name: Verified desktop preview

on:
  push:
    branches:
      - fix/main-logo-flow-alignment

jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . playwright
      - run: python -m playwright install --with-deps chromium
      - name: Render current branch HTML
        run: |
          mkdir -p verified-preview
          python - <<'PY'
          from pathlib import Path
          from agent_proof_runtime.mission_control_ui_v3 import render_mission_control_v3
          html = render_mission_control_v3('preview-token')
          assert 'left: -43px;' in html
          Path('verified-preview/index.html').write_text(html, encoding='utf-8')
          PY
      - name: Capture and verify desktop render
        run: |
          python -m http.server 4173 -d verified-preview >/tmp/apr-preview.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 900}, device_scale_factor=1)
              page.goto('http://127.0.0.1:4173', wait_until='networkidle')
              left = page.locator('.brand-source').evaluate("el => getComputedStyle(el).left")
              assert left == '-43px', left
              box = page.locator('.brand-mask').bounding_box()
              source_box = page.locator('.brand-source').bounding_box()
              assert box and source_box
              Path('verified-preview/verification.txt').write_text(
                  f'computed_left={left}\nmask_box={box}\nsource_box={source_box}\nviewport=1440x900\n',
                  encoding='utf-8'
              )
              page.screenshot(path='verified-preview/verified-preview.png', full_page=True)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-desktop-preview
          path: verified-preview/
          retention-days: 3
