[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-proof-runtime"
version = "0.3.0"
description = "Development sandbox with independently verifiable execution receipts for AI agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HazEOskA" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=2.0.0"]

[project.scripts]
apr = "agent_proof_runtime.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
agent_proof_runtime = ["data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
